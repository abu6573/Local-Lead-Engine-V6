
<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function() {
        if (typeof global === 'undefined') {
          window.global = window;
        }
        try {
          var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          if (nativeFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return nativeFetch;
              },
              set: function(v) {
                if (typeof v === 'function') {
                  nativeFetch = v;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore if already defined
        }
      })();
    </script>
